<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de pago</title>
    <link rel="stylesheet" href="./styles/pago.css">
    <script src="./js/pago.js" defer></script>
</head>
<body>

    <main class="pago">
        <h3>Realizar pago</h3>
        <p>Completa los datos para continuar con tu compra.</p>

        <form id="form-pago">

            <!-- Número de tarjeta -->
            <label for="tarjeta">Número de tarjeta</label>
            <input
                type="text"
                id="tarjeta"
                name="tarjeta"
                placeholder="1234 5678 9012 3456"
                inputmode="numeric"
                pattern="[0-9 ]{16,19}"
                maxlength="19"
                autocomplete="cc-number"
                required
                title="Ingresa un número de tarjeta de 16 dígitos."
            >

            <!-- Código de seguridad -->
            <label for="cvv">Código de seguridad (CVV)</label>
            <input
                type="password"
                id="cvv"
                name="cvv"
                placeholder="123"
                inputmode="numeric"
                pattern="[0-9]{3,4}"
                minlength="3"
                maxlength="4"
                autocomplete="cc-csc"
                required
                title="Ingresa un código de 3 o 4 dígitos."
            >

            <!-- Confirmar pago -->
            <button type="submit">Confirmar pago</button>

        </form>
    </main>
</body>
</html>
